[project]
name = "credit-memo-agent"
version = "0.1.0"
description = "A UK SME cash-flow credit-memo agent: deterministic metrics, cited figures, policy checks, and a human sign-off before anything leaves the building."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anoop Vijayan" }]
dependencies = [
  "langgraph>=1.0",
  "pydantic>=2.6",
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40"]
mcp = ["mcp>=2.0"]
durable = ["langgraph-checkpoint-sqlite>=3.0"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
cma = "cma.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cma"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "RUF"]
ignore = ["B008", "E501"]  # typer.Option defaults are the idiom; lines are wrapped by hand

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "contracts: interface and data-format contracts (Bridgie verify tier 'contracts')",
    "invariants: correctness properties P1-Pn from the design (Bridgie verify tier 'invariants')",
    "dual_run: old and new behaviour compared side by side, such as CMA_RULESET=v1 against v2 (Bridgie verify tier 'dual_run')",
]
