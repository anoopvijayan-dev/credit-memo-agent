# Built-in categorisation table v2: v1's rules plus the maintained lists of R4 (UK card
# acquirers, payment gateways, marketplaces and delivery platforms; business lenders and
# merchant cash advance providers; own pots and savings; cash paid in; cash-withdrawal
# wording; HMRC repayments; refunds; explained non-trading money in).
#
# Rules are ordered; the first whose pattern (or one of whose names) matches the
# upper-cased description, whose `unless` does not, and whose direction matches the sign
# of the amount wins. `names` are plain words matched whole, with any run of spaces
# between words; `pattern` is a Python regular expression.
#
# Classification is in two stages. First the line type, from explicit wording: a returned
# direct debit; a move to or from the applicant's own pot, space or savings; an HMRC line;
# a refund or reversal; and the payment rail (Faster Payment, FP, FPI, BACS, BGC, CHAPS, a
# transfer, a standing order, a direct credit) anywhere in the line, which rules out cash
# paid in. Only then the name lists: lenders and merchant cash advance providers, director
# or capital wording, cash venues, rent, acquirers, gateways, marketplaces and delivery
# platforms. So "TFR FROM SAVINGS CAPITAL RESERVE" is an own-account transfer and "CARD
# REFUND CAPITAL OFFICE SUPPLIES" a refund, whatever names follow the line-type wording.
# A rail has no category of its own: a rail line with a name on a list takes that list's
# category, except cash, which a rail line never is.
#
# The stages are enforced: every rule says `stage: line_type` or `stage: names`, every
# line_type rule is protected and comes before any names rule, or the table is refused.
# Two line_type cues that put a credit in different money-in buckets make it a judgement
# for a person (the bank's own `^UNPAID DD` code excepted, it is decisive). With no cue,
# a credit the first matching name list counts as trading receipts while another list
# says something else (a director, a lender, CAPITAL in a branch name) is a judgement too.
# Cash paid in heads the name lists: it is how money arrived, not what it is.
#
# Protected rules come first and win over the case profile and firm rules; only a
# per-line override changes a line they match (R21). They are the line-type rules (returned
# DD, own pot or savings move, HMRC, refund) and the protected name lists (cash paid in,
# lender, director, capital introduced, shareholder, generic loan wording). The precedence is in src/cma/categorise.py.
# A rule may also have `requires`, a pattern that must match too.
#
# Bare words are not evidence. SAVINGS, SAVER or POT alone (a payer called "SAVINGS AND
# LOANS", an HMRC reference) is not a move between the applicant's own accounts: only
# move wording ("TO SAVINGS", "FROM POT", "POT TRANSFER") or an own account named in the
# case profile is. CAPITAL alone (a branch, a pot, a merchant) is not director funding:
# only capital introduced, injected or contributed is. Generic explained words (interest,
# grant, cashback, compensation) are a name list, so an explicit refund wins over them.
#
# Ambiguous wording never resolves to trading receipts: refunds, own-pot moves and
# explained non-trading credits are tried before the acquirer lists, so "PAYPAL REFUND" is a
# refund and "STRIPE CAPITAL" a drawdown. Cash paid in is trading receipts (D31).
id: v2
frozen: false
rules:
  # --- stage 1, line type: explicit wording, protected; two of these in different
  # money-in buckets on one credit make it a judgement for a person ----------------
  - id: returned_dd
    pattern: '^UNPAID DD\b'
    direction: any
    category: returned_dd
    protected: true
    stage: line_type
  # An explicit move to or from the applicant's own pot, space or savings, either way,
  # whatever the pot or account is called: "TFR TO POT RENT", "TO POT HMRC VAT", "TFR FROM
  # SAVINGS CAPITAL RESERVE" and "FROM POT IWOCA" are own-account transfers.
  - id: own_pots_savings
    names:
      - POT TRANSFER
      - TO POT
      - TFR VAT POT
      - TO VAT POT
      - FROM VAT POT
      - TFR TAX POT
      - TO TAX POT
      - FROM TAX POT
      - FROM POT
      - TO SPACE
      - FROM SPACE
      - SAVINGS TRANSFER
      - SAVINGS TFR
      - TFR SAVINGS
      - TRANSFER SAVINGS
      - TO SAVINGS
      - FROM SAVINGS
      - TO SAVER
      - FROM SAVER
      - TO BUSINESS SAVER
      - FROM BUSINESS SAVER
      - TO INSTANT ACCESS
      - FROM INSTANT ACCESS
    direction: any
    category: own_account_transfer
    protected: true
    stage: line_type
  - id: hmrc_vat
    pattern: 'HMRC VAT'
    direction: out
    category: hmrc_vat
    protected: true
    stage: line_type
  - id: hmrc_paye
    pattern: 'HMRC PAYE'
    direction: out
    category: hmrc_paye
    protected: true
    stage: line_type
  # HMRC paying money back (VAT repayment, tax refund, R&D credit). Before the refund
  # wording: an HMRC refund is an HMRC repayment, its own bucket.
  - id: hmrc_repayment
    names: [HMRC, HM REVENUE]
    unless: '(?<![A-Z0-9])(?:(?:TO|FROM|TFR)\s+(?:(?:TAX|VAT)\s+)?(?:POT|SPACE|SAVINGS|SAVER|BUSINESS\s+SAVER|INSTANT\s+ACCESS)|POT\s+TRANSFER|SAVINGS\s+(?:TRANSFER|TFR)|(?:TFR|TRANSFER)\s+SAVINGS)(?![A-Z0-9])'
    direction: in
    category: hmrc_repayment
    protected: true
    stage: line_type
  # Money given back: a refund, reversal, returned payment or chargeback, from anyone,
  # a named lender or a payer called CAPITAL or DIRECTOR included. Money out with the same
  # wording is left to the name lists: a payment to a lender stays debt service.
  - id: refunds
    names: [REFUND, REFUNDED, REVERSAL, REVERSED, RETURNED PAYMENT, PAYMENT RETURNED, CHARGEBACK]
    unless: '(?<![A-Z0-9])(?:HMRC|HM\s+REVENUE)(?![A-Z0-9])'
    direction: in
    category: refund_in
    protected: true
    stage: line_type
  # --- stage 2, name lists ---------------------------------------------------------
  # Cash paid in at a counter or a machine, at a bank, a Post Office or a PayPoint. A
  # cheque is not cash. Post Office and PayPoint count only with cash, deposit or counter
  # wording: both also pay by transfer, and their name alone is not cash. An electronic
  # payment (Faster Payment, including the FP and FPI codes, BACS, CHAPS, a bank giro
  # credit (BGC), a transfer, a standing order, a direct credit) is never cash, wherever in the line the rail is named and whatever its payer-written
  # reference says; it stays unexplained for a person.
  - id: cash_paid_in
    names:
      - CASH PAID IN
      - CASH DEPOSIT
      - CASH DEP
      - CASH CREDIT
      - CASH IN BRANCH
      - PAID IN AT
      - COUNTER CREDIT
      - COUNTER DEPOSIT
      - DEPOSIT MACHINE
      - ATM DEPOSIT
      - CDM DEPOSIT
      - POST OFFICE CASH
      - POST OFFICE DEPOSIT
      - POST OFFICE COUNTER CREDIT
      - POST OFFICE COUNTER DEPOSIT
      - PAYPOINT CASH
      - PAYPOINT DEPOSIT
    unless: '(?<![A-Z0-9])(?:CHEQUES?|CHQ|FPS|FPI|FP|BGC|FASTER\s+PAYMENTS?|BACS|CHAPS|TFR|TRANSFER|SO|STO|STANDING\s+ORDER|DIRECT\s+CREDIT)(?![A-Z0-9])'
    direction: in
    category: cash_deposit
    protected: true
    stage: names
  # UK business lenders and merchant cash advance providers, named. Before the director
  # and capital wording, so "STRIPE CAPITAL" and "BOOST CAPITAL" are lenders.
  - id: lender_repayment
    names: &lenders
      - FUNDING CIRCLE
      - IWOCA
      - YOULEND
      - LIBERIS
      - 365 BUSINESS FINANCE
      - CAPIFY
      - BOOST CAPITAL
      - FLEXIMIZE
      - MARKETFINANCE
      - MARKET FINANCE
      - NUCLEUS COMMERCIAL FINANCE
      - ESME LOANS
      - ALLICA
      - ULTIMATE FINANCE
      - BIZCAP
      - SWIFTFUND
      - GOT CAPITAL
      - MERCHANT MONEY
      - UNCAPPED
      - CLEARCO
      - WAYFLYER
      - OPTIMUM FINANCE
      - LENDINGCROWD
      - ARCHOVER
      - THINCATS
      - SHAWBROOK
      - CLOSE BROTHERS
      - ALDERMORE
      - STRIPE CAPITAL
      - PAYPAL WORKING CAPITAL
      - PAYPAL BUSINESS LOAN
      - SHOPIFY CAPITAL
      - AMAZON LENDING
      - SQUARE CAPITAL
      - SQUARE LOANS
      - SUMUP CASH ADVANCE
      - MERCHANT CASH ADVANCE
      - BUSINESS CASH ADVANCE
      - BOUNCE BACK LOAN
      - BBLS
      - CBILS
      - RECOVERY LOAN SCHEME
    direction: out
    category: loan_repayment
    protected: true
    stage: names
  - id: lender_drawdown
    names: *lenders
    direction: in
    category: loan_drawdown
    protected: true
    stage: names
  - id: loan_repayment
    pattern: '\bLOAN\b|FINANCE\b'
    direction: out
    category: loan_repayment
    protected: true
    stage: names
  # Money from a director, shareholder or owner, or capital introduced. Before the
  # generic loan wording, so a director's loan to the business is director funding.
  - id: director_funding
    names: [DIRECTOR, DIRECTORS, OWNER, SHAREHOLDER, SHAREHOLDERS, CAPITAL INTRODUCED, CAPITAL INJECTION, CAPITAL CONTRIBUTION]
    direction: in
    category: director_funding
    protected: true
    stage: names
  - id: loan_drawdown
    pattern: '\bLOAN\b|FINANCE\b'
    direction: in
    category: loan_drawdown
    protected: true
    stage: names
  - id: owner_drawings
    pattern: 'OWNER DRAWINGS|DIRECTOR DRAWINGS|DIVIDEND'
    direction: out
    category: owner_drawings
    protected: true
    stage: names
  # Explained, but not trading: grants, insurance claims, interest, cashback.
  - id: explained_non_trading
    names: [INTEREST, GRANT, INSURANCE CLAIM, INSURANCE PAYOUT, INSURANCE SETTLEMENT, CASHBACK, COMPENSATION]
    direction: in
    category: other_explained_in
    stage: names
  # Bare pot names with no move wording ("TAX POT", "VAT POT"): a name, not a line type,
  # so explicit wording such as a refund comes first. An own-account transfer otherwise.
  - id: pot_names
    names: [VAT POT, TAX POT]
    direction: any
    category: own_account_transfer
    stage: names
  - id: bank_fees
    pattern: 'UNPAID ITEM FEE|ACCOUNT FEES|BANK CHARGES'
    direction: out
    category: bank_fees
    stage: names
  - id: payroll
    pattern: 'PAYROLL|SALARIES'
    direction: out
    category: payroll
    stage: names
  - id: rent
    pattern: '\bRENT\b'
    direction: out
    category: rent
    stage: names
  # Trading receipts. The first three patterns are v1's synthetic acquirer wording.
  - id: card_settlement
    pattern: 'ACQUIRER SETTLEMENT|PAYGATE PAYOUT|CARD SETTLEMENT'
    direction: in
    category: revenue_card_settlement
    stage: names
  - id: card_acquirers
    names:
      - SUMUP
      - SUM UP
      - SQUARE UK
      - SQUARE EUROPE
      - SQUARE PAYMENTS
      - ZETTLE
      - IZETTLE
      - WORLDPAY
      - BARCLAYCARD MERCHANT
      - BARCLAYCARD PAYMENT ACCEPTANCE
      - ELAVON
      - GLOBAL PAYMENTS
      - GLOBALPAYMENTS
      - CARDNET
      - TAKEPAYMENTS
      - DOJO
      - PAYMENTSENSE
      - TEYA
      - SALTPAY
      - ADYEN
      - CHECKOUT.COM
      - CHECKOUT COM
      - TRUST PAYMENTS
      - FISERV
      - FIRST DATA
      - VIVA WALLET
      - MYPOS
      - EVO PAYMENTS
      - HANDEPAY
      - TOTAL PROCESSING
    direction: in
    category: revenue_card_settlement
    stage: names
  - id: payment_gateways
    names:
      - STRIPE
      - PAYPAL
      - GOCARDLESS
      - OPAYO
      - SAGEPAY
      - SAGE PAY
      - BRAINTREE
      - KLARNA
      - CLEARPAY
      - PAYSAFE
    direction: in
    category: revenue_card_settlement
    stage: names
  # Marketplace payouts. Amazon by its payout entities only: a plain AMAZON credit is
  # usually a refund on a purchase, and stays for a person to look at.
  - id: marketplaces
    names:
      - AMAZON PAYMENTS
      - AMAZON EU
      - AMAZON SERVICES EUROPE
      - AMZN PAYMENTS
      - AMZN MKTP PAYOUT
      - EBAY
      - ETSY
      - NOT ON THE HIGH STREET
      - NOTHS
      - ONBUY
      - SHOPIFY
      - FRUUGO
    direction: in
    category: revenue_card_settlement
    stage: names
  - id: delivery_platforms
    names:
      - DELIVEROO
      - ROOFOODS
      - JUST EAT
      - JUSTEAT
      - JUST-EAT
      - UBER EATS
      - PORTIER EATS
      - FOODHUB
    direction: in
    category: revenue_card_settlement
    stage: names
  - id: invoice_transfer
    pattern: '\bINV(?:OICE)?\s*[-#:]?\s*\d+'
    direction: in
    category: revenue_transfer
    stage: names
  # Cash taken out. The category is what an unmatched debit gets anyway (supplier); the
  # rule is here so the line records cash_withdrawal as its rule, which the cash round-trip
  # indicator reads. Last, so it never takes a debit from another rule.
  - id: cash_withdrawal
    names:
      - CASH WITHDRAWAL
      - CASH WDL
      - CASH WITHDRAWN
      - ATM
      - CASH MACHINE
      - CASHPOINT
      - POST OFFICE CASH
      - COUNTER WITHDRAWAL
    direction: out
    category: supplier
    stage: names
