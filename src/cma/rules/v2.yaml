# Built-in categorisation table v2: v1's rules plus the maintained lists of R4 (UK card
# acquirers, payment gateways, marketplaces and delivery platforms; business lenders and
# merchant cash advance providers; own pots and savings; cash paid in; cash-withdrawal
# wording; HMRC repayments; refunds; explained non-trading money in).
#
# Rules are ordered; the first whose pattern (or one of whose names) matches the
# upper-cased description, whose `unless` does not, and whose direction matches the sign
# of the amount wins. `names` are plain words matched whole, with any run of spaces
# between words; `pattern` is a Python regular expression.
#
# Protected rules (returned DD, director, capital, shareholder, lender, HMRC) come first
# and win over the case profile and firm rules; only a per-line override changes a line
# they match (R21). The precedence is in src/cma/categorise.py. A rule may also have
# `requires`, a pattern that must match too.
#
# An explicit move to or from the applicant's own pot or space ("TFR FROM POT CAPITAL
# RESERVE", "TO POT HMRC VAT") is an own-account transfer whatever the pot is called, so
# every protected rule but a returned DD has `unless: *pot_move` and leaves it to the own
# pots rule below. Savings wording alone is not a pot move: "DIRECTOR SAVINGS" stays
# director funding.
#
# Ambiguous wording never resolves to trading receipts: refunds, own pots and explained
# non-trading credits are tried before the acquirer lists, so "PAYPAL REFUND" is a
# refund and "STRIPE CAPITAL" a drawdown. Cash paid in is trading receipts (D31).
id: v2
frozen: false
rules:
  # --- protected ---------------------------------------------------------------------
  - id: returned_dd
    pattern: '^UNPAID DD\b'
    direction: any
    category: returned_dd
    protected: true
  - id: hmrc_vat
    pattern: 'HMRC VAT'
    unless: &pot_move '(?<![A-Z0-9])(?:POT\s+TRANSFER|(?:TO|FROM)\s+(?:POT|SPACE)|(?:VAT|TAX)\s+POT)(?![A-Z0-9])'
    direction: out
    category: hmrc_vat
    protected: true
  - id: hmrc_paye
    pattern: 'HMRC PAYE'
    unless: *pot_move
    direction: out
    category: hmrc_paye
    protected: true
  # HMRC paying money back (VAT repayment, tax refund, R&D credit).
  - id: hmrc_repayment
    names: [HMRC, HM REVENUE]
    unless: *pot_move
    direction: in
    category: hmrc_repayment
    protected: true
  # UK business lenders and merchant cash advance providers, named. Before the director
  # and capital wording, so "STRIPE CAPITAL" and "BOOST CAPITAL" are lenders.
  - id: lender_repayment
    names: &lenders
      - FUNDING CIRCLE
      - IWOCA
      - YOULEND
      - LIBERIS
      - 365 BUSINESS FINANCE
      - CAPIFY
      - BOOST CAPITAL
      - FLEXIMIZE
      - MARKETFINANCE
      - MARKET FINANCE
      - NUCLEUS COMMERCIAL FINANCE
      - ESME LOANS
      - ALLICA
      - ULTIMATE FINANCE
      - BIZCAP
      - SWIFTFUND
      - GOT CAPITAL
      - MERCHANT MONEY
      - UNCAPPED
      - CLEARCO
      - WAYFLYER
      - OPTIMUM FINANCE
      - LENDINGCROWD
      - ARCHOVER
      - THINCATS
      - SHAWBROOK
      - CLOSE BROTHERS
      - ALDERMORE
      - STRIPE CAPITAL
      - PAYPAL WORKING CAPITAL
      - PAYPAL BUSINESS LOAN
      - SHOPIFY CAPITAL
      - AMAZON LENDING
      - SQUARE CAPITAL
      - SQUARE LOANS
      - SUMUP CASH ADVANCE
      - MERCHANT CASH ADVANCE
      - BUSINESS CASH ADVANCE
      - BOUNCE BACK LOAN
      - BBLS
      - CBILS
      - RECOVERY LOAN SCHEME
    unless: *pot_move
    direction: out
    category: loan_repayment
    protected: true
  # A named lender's explicit refund or reversal ("DD REPAYMENT REVERSAL IWOCA LTD") is
  # money given back, not a new drawdown. Still protected: a lender line (R21).
  - id: lender_refund
    names: *lenders
    requires: &refund_wording '(?<![A-Z0-9])(?:REFUND|REFUNDED|REVERSAL|REVERSED|RETURNED\s+PAYMENT|PAYMENT\s+RETURNED|CHARGEBACK)(?![A-Z0-9])'
    unless: *pot_move
    direction: in
    category: refund_in
    protected: true
  - id: lender_drawdown
    names: *lenders
    unless: *pot_move
    direction: in
    category: loan_drawdown
    protected: true
  - id: loan_repayment
    pattern: '\bLOAN\b|FINANCE\b'
    unless: *pot_move
    direction: out
    category: loan_repayment
    protected: true
  # Money from a director, shareholder or owner, or capital introduced. Before the
  # generic loan wording, so a director's loan to the business is director funding.
  - id: director_funding
    names: [DIRECTOR, DIRECTORS, OWNER, CAPITAL, SHAREHOLDER, SHAREHOLDERS]
    unless: *pot_move
    direction: in
    category: director_funding
    protected: true
  # Generic loan or finance wording, unless the line says it is a refund or a reversal
  # (the refund wording above, or a pot move): "CARD REFUND ACME RETAIL FINANCE" is money
  # given back, not debt drawn, and goes to the refunds rule below.
  - id: loan_drawdown
    pattern: '\bLOAN\b|FINANCE\b'
    unless: '(?<![A-Z0-9])(?:REFUND|REFUNDED|REVERSAL|REVERSED|RETURNED\s+PAYMENT|PAYMENT\s+RETURNED|CHARGEBACK|POT\s+TRANSFER|(?:TO|FROM)\s+(?:POT|SPACE)|(?:VAT|TAX)\s+POT)(?![A-Z0-9])'
    direction: in
    category: loan_drawdown
    protected: true
  - id: owner_drawings
    pattern: 'OWNER DRAWINGS|DIRECTOR DRAWINGS|DIVIDEND'
    unless: *pot_move
    direction: out
    category: owner_drawings
    protected: true
  # --- not protected: a profile name or a firm rule is tried before these ---------------
  # Moves between the applicant's own pots, spaces and savings, either way. First of the
  # unprotected rules, so an explicit move to a pot wins over what the pot is for:
  # "TFR TO POT RENT" is an own-account transfer, not rent.
  - id: own_pots_savings
    names:
      - POT TRANSFER
      - TO POT
      - FROM POT
      - SAVINGS
      - SAVER
      - BUSINESS SAVER
      - INSTANT ACCESS
      - TO SPACE
      - FROM SPACE
      - VAT POT
      - TAX POT
    direction: any
    category: own_account_transfer
  - id: bank_fees
    pattern: 'UNPAID ITEM FEE|ACCOUNT FEES|BANK CHARGES'
    direction: out
    category: bank_fees
  - id: payroll
    pattern: 'PAYROLL|SALARIES'
    direction: out
    category: payroll
  - id: rent
    pattern: '\bRENT\b'
    direction: out
    category: rent
  - id: refunds
    names: [REFUND, REFUNDED, REVERSAL, REVERSED, RETURNED PAYMENT, PAYMENT RETURNED, CHARGEBACK]
    direction: in
    category: refund_in
  # Explained, but not trading: grants, insurance claims, interest, cashback.
  - id: explained_non_trading
    names: [INTEREST, GRANT, INSURANCE CLAIM, INSURANCE PAYOUT, INSURANCE SETTLEMENT, CASHBACK, COMPENSATION]
    direction: in
    category: other_explained_in
  # Cash paid in at a counter or a machine, at a bank, a Post Office or a PayPoint. A
  # cheque is not cash. Post Office and PayPoint count only with cash, deposit or counter
  # wording: both also pay by transfer, and their name alone is not cash. An electronic
  # payment (Faster Payment, BACS, CHAPS, a transfer, a standing order, a direct credit)
  # is never cash, wherever in the line the rail is named and whatever its payer-written
  # reference says; it stays unexplained for a person.
  - id: cash_paid_in
    names:
      - CASH PAID IN
      - CASH DEPOSIT
      - CASH DEP
      - CASH CREDIT
      - CASH IN BRANCH
      - PAID IN AT
      - COUNTER CREDIT
      - COUNTER DEPOSIT
      - DEPOSIT MACHINE
      - ATM DEPOSIT
      - CDM DEPOSIT
      - POST OFFICE CASH
      - POST OFFICE DEPOSIT
      - POST OFFICE COUNTER CREDIT
      - POST OFFICE COUNTER DEPOSIT
      - PAYPOINT CASH
      - PAYPOINT DEPOSIT
    unless: '(?<![A-Z0-9])(?:CHEQUES?|CHQ|FPS|FASTER\s+PAYMENTS?|BACS|CHAPS|TFR|TRANSFER|SO|STO|STANDING\s+ORDER|DIRECT\s+CREDIT)(?![A-Z0-9])'
    direction: in
    category: cash_deposit
  # Trading receipts. The first three patterns are v1's synthetic acquirer wording.
  - id: card_settlement
    pattern: 'ACQUIRER SETTLEMENT|PAYGATE PAYOUT|CARD SETTLEMENT'
    direction: in
    category: revenue_card_settlement
  - id: card_acquirers
    names:
      - SUMUP
      - SUM UP
      - SQUARE UK
      - SQUARE EUROPE
      - SQUARE PAYMENTS
      - ZETTLE
      - IZETTLE
      - WORLDPAY
      - BARCLAYCARD MERCHANT
      - BARCLAYCARD PAYMENT ACCEPTANCE
      - ELAVON
      - GLOBAL PAYMENTS
      - GLOBALPAYMENTS
      - CARDNET
      - TAKEPAYMENTS
      - DOJO
      - PAYMENTSENSE
      - TEYA
      - SALTPAY
      - ADYEN
      - CHECKOUT.COM
      - CHECKOUT COM
      - TRUST PAYMENTS
      - FISERV
      - FIRST DATA
      - VIVA WALLET
      - MYPOS
      - EVO PAYMENTS
      - HANDEPAY
      - TOTAL PROCESSING
    direction: in
    category: revenue_card_settlement
  - id: payment_gateways
    names:
      - STRIPE
      - PAYPAL
      - GOCARDLESS
      - OPAYO
      - SAGEPAY
      - SAGE PAY
      - BRAINTREE
      - KLARNA
      - CLEARPAY
      - PAYSAFE
    direction: in
    category: revenue_card_settlement
  # Marketplace payouts. Amazon by its payout entities only: a plain AMAZON credit is
  # usually a refund on a purchase, and stays for a person to look at.
  - id: marketplaces
    names:
      - AMAZON PAYMENTS
      - AMAZON EU
      - AMAZON SERVICES EUROPE
      - AMZN PAYMENTS
      - AMZN MKTP PAYOUT
      - EBAY
      - ETSY
      - NOT ON THE HIGH STREET
      - NOTHS
      - ONBUY
      - SHOPIFY
      - FRUUGO
    direction: in
    category: revenue_card_settlement
  - id: delivery_platforms
    names:
      - DELIVEROO
      - ROOFOODS
      - JUST EAT
      - JUSTEAT
      - JUST-EAT
      - UBER EATS
      - PORTIER EATS
      - FOODHUB
    direction: in
    category: revenue_card_settlement
  - id: invoice_transfer
    pattern: '\bINV(?:OICE)?\s*[-#:]?\s*\d+'
    direction: in
    category: revenue_transfer
  # Cash taken out. The category is what an unmatched debit gets anyway (supplier); the
  # rule is here so the line records cash_withdrawal as its rule, which the cash round-trip
  # indicator reads. Last, so it never takes a debit from another rule.
  - id: cash_withdrawal
    names:
      - CASH WITHDRAWAL
      - CASH WDL
      - CASH WITHDRAWN
      - ATM
      - CASH MACHINE
      - CASHPOINT
      - POST OFFICE CASH
      - COUNTER WITHDRAWAL
    direction: out
    category: supplier
