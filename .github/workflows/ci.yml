name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,mcp]"
      - run: ruff check src tests evals
      - run: pytest -q
      # Offline evals run with the fake model so CI needs no API keys. The job fails
      # if any computed metric disagrees with the generator's ground truth.
      - run: python evals/run_evals.py --llm fake
