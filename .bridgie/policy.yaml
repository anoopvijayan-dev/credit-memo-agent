# Project overrides of Bridgie's default policy. Only list keys you change.
version: 1
default_lane: engineering
# Verification commands per tier. Every tier the policy requires at a bet's risk needs at least one
# command; a required tier with no command is recorded as not_proven and the task cannot pass.
# Without this block, Bridgie uses the lane's commands for the stacks it detects (package.json, *.sln).
# verify:
#   commands:
#     mechanical: ['npm run lint', 'npm run build']
#     specified: ['npm test']
#     contracts: ['npm run test:contracts']
# Verification commands per tier (Python project; run inside each task's worktree).
# The marker tiers pass when a change has no tests with that marker (by the owner's choice, lenient,
# 2026-11-16); the reviewer still judges missing tests. Since 2026-11-22 (owner's choice) they read the
# full run's results (pytest --tier-results, tools/tier_check.py) instead of running those tests again.
verify:
  commands:
    mechanical: ['ruff check src tests evals', 'python -m compileall -q src']
    specified: ['python -m pytest -v -rs --tier-results']
    contracts: ['python tools/tier_check.py contracts']
    invariants: ['python tools/tier_check.py invariants']
    behavioural: ['python evals/run_evals.py']
    dual_run: ['python tools/tier_check.py dual_run']
# Owner's choice, 2026-11-22: the reviewer is Antigravity (Google), not Codex, which is at its
# usage limit until 2026-11-25. Cross-family review is on again; the tasks that passed while it
# was off (T04 to T37, reviewed by claude-code alone) are re-reviewed with Antigravity.
# TEMPORARY (owner's choice, 2026-11-23 06:0x): Antigravity is at its usage quota until about
# 06:30 UTC, so T41 and T39 are reviewed by claude-code now and re-reviewed with Antigravity
# afterwards, with the other tasks claude-code reviewed alone. Restore the Antigravity reviewer
# (delete this block and the cross_family line) once both have passed.
lanes:
  engineering:
    cross_family: false
routing:
  seats:
    reviewer: { adapter: claude-code, model: default, effort: high }
